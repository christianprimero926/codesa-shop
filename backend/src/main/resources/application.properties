# Aplicacion
spring.application.name=shop-backend
server.port=8080
server.servlet.context-path=/api
spring.threads.virtual.enabled=true

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/codesa_shop}
spring.datasource.username=${DB_USER:codesa}
spring.datasource.password=${DB_PASSWORD:codesa}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Jackson
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Logs
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
