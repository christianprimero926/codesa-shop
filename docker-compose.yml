services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codesa_shop
      POSTGRES_USER: codesa
      POSTGRES_PASSWORD: codesa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesa -d codesa_shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/codesa_shop
      DB_USER: codesa
      DB_PASSWORD: codesa
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_CONFIGURATION: production
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
